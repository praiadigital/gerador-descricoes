<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-mails de Follow-up Imobiliário — Praia Digital</title>
<meta name="description" content="Sequência de e-mails de follow-up para corretores: pós-visita, proposta enviada e reengajamento.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:680px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  button{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  .em{background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid #0077B6;border-radius:0 12px 12px 0;padding:1rem;margin-top:.8rem;font-size:.9rem;line-height:1.65;white-space:pre-wrap;display:none}
  .em b{color:#0077B6}
  .cp{float:right;border:1px solid #0077B6;color:#0077B6;background:#fff;border-radius:8px;padding:.25rem .7rem;font-size:.75rem;font-weight:700;cursor:pointer}
  .dica{margin-top:1.2rem;background:#ecfeff;border:1px solid #67e8f9;border-radius:12px;padding:1rem;font-size:.9rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/gerador-descricoes">← Gerador de Descrições</a>
</header>
<main>
  <div class="card">
    <h1>📧 Follow-up que Vende</h1>
    <p class="sub">E-mail tem taxa de leitura alta em decisões grandes. Gere a sequência pós-visita:</p>
    <label>Nome do cliente</label><input id="cliente" value="Carlos">
    <label>Imóvel visitado</label><input id="imovel" value="Apto 2 dorm. na Enseada, Guarujá">
    <label>Seu nome</label><input id="corretor" value="Ana Lima — Praia Digital">
    <button onclick="gerar()">Gerar sequência de e-mails</button>
    <div id="lista"></div>
    <div class="dica">🔄 Leads frios? Use a <a href="https://praia.digital/hermes-agents/gerador-campanha/" style="color:#0077B6;font-weight:700">Campanha de Reativação</a> · 📝 <a href="https://praia.digital/portal-corretores/gerador-proposta/" style="color:#0077B6;font-weight:700">Gerador de Proposta</a></div>
  </div>
</main>
<script>
function gerar(){
  var c=document.getElementById('cliente').value, i=document.getElementById('imovel').value, cr=document.getElementById('corretor').value;
  var ems=[
    ['E-mail 1 — Mesmo dia da visita','Assunto: Obrigado pela visita, '+c+'!\n\nOi, '+c+',\n\nfoi um prazer te mostrar o '+i+' hoje. Fico à disposição para qualquer dúvida — documentação, condomínio, simulação de financiamento.\n\nSe quiser, te mando os números completos por aqui.\n\nAbraço,\n'+cr],
    ['E-mail 2 — 2 dias depois','Assunto: '+i+' — detalhes que você pediu\n\n'+c+',\n\nseparei os documentos e uma simulação de financiamento para o imóvel. Também encontrei 2 opções parecidas na mesma região, caso queira comparar.\n\nPosso te ligar amanhã à tarde?\n\n'+cr],
    ['E-mail 3 — 5 dias depois (decisão)','Assunto: Últimas unidades nesse padrão, '+c+'\n\n'+c+',\n\no '+i+' teve mais duas visitas essa semana. Não quero te pressionar — só garantir que você não perca caso ele seja a escolha certa.\n\nSe quiser, formalizamos uma proposta sem compromisso para travar o preço por 48h.\n\n'+cr]
  ];
  document.getElementById('lista').innerHTML=ems.map(function(m,idx){
    return '<div class="em" id="e'+idx+'" style="display:block"><button class="cp" onclick="navigator.clipboard.writeText(document.getElementById(\'e'+idx+'\').innerText);this.textContent=\'✓\'">Copiar</button><b>'+m[0]+'</b>\n\n'+m[1]+'</div>';
  }).join('');
}
</script>
</body>
</html>
