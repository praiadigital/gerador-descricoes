<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Descrições de Anúncios — Praia Digital</title>
<meta name="description" content="Crie descrições de anúncios imobiliários otimizadas para Airbnb, Booking e portais em segundos.">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
  body{background:#f0f9ff;color:#0f172a;min-height:100vh}
  header{background:linear-gradient(135deg,#0077B6,#00B4D8);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
  header a{color:#fff;text-decoration:none;font-weight:700}.logo{font-size:1.2rem}
  main{max-width:760px;margin:2rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:16px;padding:1.75rem;box-shadow:0 4px 24px rgba(0,60,100,.08)}
  h1{font-size:1.5rem;color:#0077B6}.sub{color:#64748b;margin:.3rem 0 1.2rem;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:.9rem 0 .3rem}
  input,select{width:100%;padding:.7rem;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .checks{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
  .chk{background:#f1f5f9;border-radius:999px;padding:.4rem .85rem;font-size:.85rem;cursor:pointer;display:flex;gap:.35rem;align-items:center}
  .chk input{width:auto}
  button.calc{width:100%;margin-top:1.3rem;padding:.9rem;border:0;border-radius:12px;background:#0077B6;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
  .out{margin-top:1.2rem;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:1.25rem;display:none;white-space:pre-wrap;line-height:1.7;font-size:.95rem}
  .copy{margin-top:.75rem;padding:.6rem 1rem;border:1px solid #0077B6;background:#fff;color:#0077B6;border-radius:10px;font-weight:700;cursor:pointer}
  footer{background:#023047;color:#cbd5e1;padding:2rem 1.5rem;margin-top:2rem}
  footer h4{color:#fff;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.8rem}
  .links{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem}.links a{color:#90E0EF;text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<header>
  <a class="logo" href="https://praia.digital/">🏖️ Praia Digital</a>
  <a href="https://praia.digital/apps">← Todos os apps</a>
</header>
<main>
  <div class="card">
    <h1>Gerador de Descrições de Anúncios</h1>
    <p class="sub">Preencha e receba um anúncio pronto para Airbnb, Booking e portais imobiliários.</p>
    <div class="grid">
      <div><label>Tipo de imóvel</label>
        <select id="tipo"><option>Apartamento</option><option>Casa</option><option>Cobertura</option><option>Studio</option><option>Pousada</option><option>Terreno</option></select></div>
      <div><label>Cidade</label>
        <select id="cidade"><option>Santos</option><option>Guarujá</option><option>Praia Grande</option><option>São Vicente</option><option>Bertioga</option><option>Mongaguá</option><option>Itanhaém</option><option>Peruíbe</option></select></div>
      <div><label>Quartos</label><input type="number" id="quartos" value="2" min="0"></div>
      <div><label>Distância da praia</label>
        <select id="praia"><option>frente para o mar</option><option>a 1 quadra da praia</option><option>a poucos minutos da praia</option><option>em condomínio fechado</option></select></div>
    </div>
    <label>Diferenciais</label>
    <div class="checks">
      <label class="chk"><input type="checkbox" value="vista para o mar" checked> Vista mar</label>
      <label class="chk"><input type="checkbox" value="piscina"> Piscina</label>
      <label class="chk"><input type="checkbox" value="churrasqueira"> Churrasqueira</label>
      <label class="chk"><input type="checkbox" value="ar-condicionado"> Ar-condicionado</label>
      <label class="chk"><input type="checkbox" value="Wi-Fi de alta velocidade"> Wi-Fi</label>
      <label class="chk"><input type="checkbox" value="vaga de garagem"> Garagem</label>
      <label class="chk"><input type="checkbox" value="aceita pets"> Pets</label>
      <label class="chk"><input type="checkbox" value="mobiliado e equipado"> Mobiliado</label>
    </div>
    <button class="calc" onclick="gerar()">Gerar anúncio</button>
    <div class="out" id="out"></div>
    <button class="copy" id="copyBtn" style="display:none" onclick="copiar()">📋 Copiar texto</button>
  </div>
</main>
<footer>
  <h4>Rede de apps Praia Digital</h4>
  <div class="links">
    <a href="https://praia.digital/ferramentas">Kit do Anfitrião</a>
    <a href="https://praia.digital/area-anfitriao">Área do Anfitrião</a>
    <a href="https://praia.digital/avaliador-imoveis">Avaliador IA</a>
    <a href="https://praia.digital/calculadoras">Calculadoras</a>
    <a href="https://praia.digital/portal-corretores">Portal do Corretor</a>
    <a href="https://praia.digital/blog-litoral">Blog</a>
    <a href="https://praia.digital/guia-litoral">Guia do Litoral</a>
  </div>
</footer>
<script>
function gerar(){
  var tipo=document.getElementById('tipo').value, cid=document.getElementById('cidade').value;
  var q=document.getElementById('quartos').value, p=document.getElementById('praia').value;
  var difs=[].slice.call(document.querySelectorAll('.checks input:checked')).map(function(c){return c.value});
  var qtxt=q==='0'?'':(q+' quarto'+(q>1?'s':''));
  var txt='🌊 '+tipo.toUpperCase()+' EM '+cid.toUpperCase()+' — '+p.toUpperCase()+'\n\n';
  txt+='Apresentamos este(a) '+tipo.toLowerCase()+(qtxt?' com '+qtxt:'')+', '+p+', em '+cid+'. ';
  txt+='Perfeito para quem busca conforto, localização e a melhor experiência no litoral paulista.\n\n';
  if(difs.length){txt+='✨ DIFERENCIAIS\n';difs.forEach(function(d){txt+='✔ '+d.charAt(0).toUpperCase()+d.slice(1)+'\n'});txt+='\n';}
  txt+='📍 LOCALIZAÇÃO\n'+cid+' oferece praias paradisíacas, gastronomia à beira-mar e infraestrutura completa para temporada ou moradia.\n\n';
  txt+='📞 Agende sua visita ou reserve agora pelo WhatsApp. Imóvel verificado pela equipe Praia Digital.';
  var o=document.getElementById('out');o.textContent=txt;o.style.display='block';
  document.getElementById('copyBtn').style.display='inline-block';
}
function copiar(){
  navigator.clipboard.writeText(document.getElementById('out').textContent);
  document.getElementById('copyBtn').textContent='✅ Copiado!';
}
</script>
</body>
</html>
